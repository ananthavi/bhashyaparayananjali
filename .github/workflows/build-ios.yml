name: Build iOS IPA

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign the IPA (requires repo secrets)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  release:
    types: [created]

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build

      - name: Sync Capacitor to iOS project
        run: npx cap sync ios

      - name: Regenerate iOS icons + splash
        run: npx tsx scripts/build-ios-icons.ts

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: |
          gem install cocoapods --silent
          pod install --silent

      # ----- Unsigned build (the default for branch builds) -----
      - name: Build unsigned IPA
        if: ${{ github.event.inputs.sign != 'true' && github.event_name != 'release' }}
        working-directory: ios/App
        run: |
          set -euxo pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            archive
          # Manually package an unsigned IPA so the artifact has the .ipa
          # extension and can be re-signed later by Sideloadly / AltStore /
          # an Apple Developer Program signing pipeline.
          mkdir -p build/ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/App.app build/ipa/Payload/
          cd build/ipa
          zip -ry App.ipa Payload
          ls -lh App.ipa

      # ----- Signed build (only when explicitly requested + secrets present) -----
      - name: Import signing certificate
        if: ${{ github.event.inputs.sign == 'true' || github.event_name == 'release' }}
        env:
          CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_BASE64" ]; then
            echo "::error::IOS_CERT_BASE64 secret not set; cannot produce a signed IPA."
            exit 1
          fi
          echo "$CERT_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm /tmp/cert.p12

      - name: Install provisioning profile
        if: ${{ github.event.inputs.sign == 'true' || github.event_name == 'release' }}
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build signed IPA
        if: ${{ github.event.inputs.sign == 'true' || github.event_name == 'release' }}
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
        working-directory: ios/App
        run: |
          set -euxo pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -archivePath build/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive
          # Export an .ipa from the archive using ad-hoc distribution.
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>net.sringeri.advaita.bhashyaparayana</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/ipa
          ls -lh build/ipa

      - name: Rename IPA with commit SHA
        id: rename
        run: |
          set -euxo pipefail
          SHORT_SHA=$(git rev-parse --short HEAD)
          IPA_DIR=ios/App/build/ipa
          IPA_IN=$(ls "$IPA_DIR"/*.ipa | head -1)
          IPA_OUT=parayananjali-${SHORT_SHA}.ipa
          cp "$IPA_IN" "$IPA_OUT"
          echo "ipa=$IPA_OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          ls -lh "$IPA_OUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: parayananjali-ios-ipa
          path: ${{ steps.rename.outputs.ipa }}
          retention-days: 90
          if-no-files-found: error

      - name: Attach IPA to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.ipa }}

      - name: Summary
        run: |
          {
            echo "## iOS IPA built"
            echo ""
            echo "**Commit:** \`${{ steps.rename.outputs.sha }}\`"
            echo "**Artifact:** \`${{ steps.rename.outputs.ipa }}\`"
            echo ""
            if [ "${{ github.event.inputs.sign }}" = "true" ] || [ "${{ github.event_name }}" = "release" ]; then
              echo "Signed for ad-hoc distribution. Install via Apple Configurator,"
              echo "Diawi, or your MDM."
            else
              echo "Unsigned IPA. To install on a device you must re-sign with one of:"
              echo "- Sideloadly (free Apple ID, 7-day cert)"
              echo "- AltStore (free Apple ID, auto-resigned)"
              echo "- Xcode → Window → Devices, drag the IPA onto your phone (paid"
              echo "  developer account, 1-year cert)"
            fi
            echo ""
            echo "Full instructions in [\`docs/ios.md\`](docs/ios.md)."
          } >> "$GITHUB_STEP_SUMMARY"
