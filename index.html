<!doctype html>
<html lang="sa">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6b3410" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Śaṅkara-bhāṣya-pārāyaṇāñjali — offline reader for Ādi Śaṅkarācārya's Prasthāna-trayī Bhāṣyas with multi-script transliteration, full-text search, and Sanskrit dictionary lookup."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Best-rated Google Fonts for each supported script, tuned for long-form
      parayanam reading:
        • Devanagari: Noto Serif Devanagari (Sanskrit-style serif, excellent
          virama/conjunct coverage) with Tiro Devanagari Sanskrit as fallback.
        • Malayalam: Manjari (user-requested; calm, low-contrast serif by SMC).
        • Tamil: Noto Serif Tamil, paired with Tiro Tamil for Sanskrit loans.
        • Telugu: Noto Serif Telugu, with Ramaraja as a classical fallback.
        • Kannada: Noto Serif Kannada, with Gubbi as a classical alternative.
        • Bengali: Noto Serif Bengali with Hind Siliguri for readability at
          smaller sizes.
        • Gujarati: Noto Serif Gujarati with Hind Vadodara fallback.
        • Gurmukhi / Oriya: Noto Sans variants (no serif release yet).
        • Latin: Inter for UI, Tiro Devanagari Hindi for IAST/ITRANS glyphs
          whose diacritics Google's own Noto Serif renders well.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manjari:wght@400;700&family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Tiro+Devanagari+Sanskrit&family=Noto+Serif+Tamil:wght@400;500;600;700&family=Tiro+Tamil&family=Noto+Serif+Telugu:wght@400;500;600;700&family=Ramaraja&family=Noto+Serif+Kannada:wght@400;500;600;700&family=Gubbi&family=Noto+Serif+Bengali:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Gujarati:wght@400;500;600;700&family=Hind+Vadodara:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Noto+Sans+Oriya:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Śaṅkara-bhāṣya-pārāyaṇāñjali</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
